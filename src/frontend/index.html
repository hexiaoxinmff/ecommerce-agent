<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>云栖数码 · AI 智能客服</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --text: #e6e8ec;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #36c5a8;
    --user-bubble: #2d4a7a;
    --bot-bubble: #1e222b;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--accent-2); margin-right:6px; }

  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size: 13px; }
  .msg.bot .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .msg.user .avatar { background: var(--user-bubble); }
  .bubble { background: var(--bot-bubble); padding: 11px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; border: 1px solid var(--border); }
  .msg.user .bubble { background: var(--user-bubble); border-color: transparent; }
  .intent { display:inline-block; font-size: 11px; color: var(--accent-2); border:1px solid var(--border); padding: 1px 7px; border-radius: 20px; margin-bottom: 6px; }
  .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; color: var(--muted); background: var(--panel-2); border:1px solid var(--border); padding: 2px 8px; border-radius: 6px; }

  #typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 0; }

  footer { padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #input { flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 11px 14px; font-size: 14px; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { background: var(--accent); color: #fff; border: none; padding: 0 20px; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
  #send:disabled { opacity: .5; cursor: default; }
  .quick { display:flex; gap:8px; flex-wrap: wrap; padding: 0 20px 12px; }
  .quick button { background: var(--panel-2); border:1px solid var(--border); color: var(--muted); font-size:12px; padding:5px 11px; border-radius:20px; cursor:pointer; }
  .quick button:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
  <header>
    <div class="logo">云</div>
    <div>
      <h1>云栖数码 · AI 智能客服</h1>
      <div class="sub">基于 Agent + RAG 的电商客服 Demo</div>
    </div>
    <div id="status"><span class="dot"></span><span id="statusText">连接中…</span></div>
  </header>

  <div id="chat"></div>

  <div class="quick" id="quick">
    <button>云栖 X1 手机有什么亮点？</button>
    <button>怎么申请七天无理由退货？</button>
    <button>帮我查订单 YS20240001 的物流</button>
    <button>支持哪些支付方式？</button>
  </div>

  <footer>
    <input id="input" placeholder="输入您的问题，回车发送…" autocomplete="off" />
    <button id="send">发送</button>
  </footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const statusText = document.getElementById('statusText');

  // 健康检查
  fetch('/api/health').then(r => r.json()).then(d => {
    statusText.textContent = d.mock_mode ? '演示模式（无 API Key）' : `在线 · ${d.provider}`;
  }).catch(() => statusText.textContent = '离线');

  function addMsg(role, text, intent, sources) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? '我' : 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'bot' && intent) {
      const tag = document.createElement('span');
      tag.className = 'intent';
      tag.textContent = intent;
      bubble.appendChild(tag);
      bubble.appendChild(document.createElement('br'));
    }
    bubble.appendChild(document.createTextNode(text));
    if (role === 'bot' && sources && sources.length) {
      const sc = document.createElement('div');
      sc.className = 'sources';
      sources.forEach(s => {
        const c = document.createElement('span');
        c.className = 'chip';
        c.textContent = '📄 ' + (s.title || s.source);
        sc.appendChild(c);
      });
      bubble.appendChild(sc);
    }
    wrap.appendChild(av);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function typing(on) {
    let t = document.getElementById('typing');
    if (on) {
      if (!t) { t = document.createElement('div'); t.id = 'typing'; t.textContent = 'AI 正在思考…'; chat.appendChild(t); chat.scrollTop = chat.scrollHeight; }
    } else if (t) { t.remove(); }
  }

  async function ask(q) {
    if (!q.trim()) return;
    addMsg('user', q);
    input.value = '';
    send.disabled = true; typing(true);
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: q })
      });
      const data = await res.json();
      typing(false);
      addMsg('bot', data.answer, data.intent, data.sources);
    } catch (e) {
      typing(false);
      addMsg('bot', '抱歉，服务暂时不可用，请稍后再试。');
    } finally { send.disabled = false; input.focus(); }
  }

  send.onclick = () => ask(input.value);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(input.value); });
  document.querySelectorAll('#quick button').forEach(b => b.onclick = () => ask(b.textContent));

  addMsg('bot', '您好！我是云栖数码旗舰店的 AI 客服，可以帮您解答商品咨询、退换货、物流查询等问题。试试下面的快捷问题，或直接输入您的问题～');
</script>
</body>
</html>
